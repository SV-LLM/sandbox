name: Sandbox Stage 2 Page Load (manual)

# AT-04 Stage 2, first test: load each provider's public LLM URL in an ephemeral
# StegBrowser session (page_load.v1) and capture a screenshot. Nothing is typed,
# clicked or submitted; no prompt, selector or credential exists in this path.
# Manual only; never runs on push or pull_request.
#
# Conformance lane (WORKFLOW_LOCAL_ORGANIZATION_LEDGER_CONFORMANCE), as AT-04
# Stage 1 runs it: workflow-local organization ledger, never authoritative
# organization runtime reality. Every attempt is a SANDBOX_TOOL_OBSERVATION_RECORDED
# receipt. Evidence, including test-results/<Repository>/{screenshot.png,
# page-load.json}, is uploaded as a 90-day artifact (live-run evidence retention,
# not permanent custody). Any non-ALLOW observation ends the run red.

on:
  workflow_dispatch:
    inputs:
      repositories:
        description: "Comma-separated provider repositories from live/page_load_targets.json (empty = all 18)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  page-load:
    runs-on: ubuntu-latest
    env:
      EVIDENCE_DIR: ${{ github.workspace }}/stage2-evidence
      SV_LLM_DOTGITHUB_ROOT: ${{ github.workspace }}/sv-llm-dotgithub
      PAGE_LOAD_REPOSITORIES: ${{ inputs.repositories }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out SV-LLM/.github (registration, vendored contracts, organization ledger)
        uses: actions/checkout@v4
        with:
          repository: SV-LLM/.github
          ref: 856d9197f4c3e6ff7f0b6a9c3c2dfa55876f0807
          path: sv-llm-dotgithub
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and Chromium
        run: |
          python -m pip install "jsonschema==4.26.0" "playwright==1.52.0"
          python -m playwright install --with-deps chromium
      - name: Stage 2 page loads (ephemeral StegBrowser)
        run: python -B live/run_page_load.py
      - name: Retain evidence (90 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-stage2-page-load-evidence-${{ github.run_id }}
          path: ${{ github.workspace }}/stage2-evidence
          retention-days: 90
          if-no-files-found: error
