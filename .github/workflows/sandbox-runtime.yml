name: Validate Sandbox Runtime

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out SV-LLM/.github at the pinned registration commit
        uses: actions/checkout@v4
        with:
          repository: SV-LLM/.github
          ref: dcbccd8589b60e114600ae2c6253b1ce81c0f643
          path: sv-llm-dotgithub
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (shared set for Sandbox and vendored StegBrowser llm.v1)
        run: python -m pip install "jsonschema==4.26.0" "pytest==8.3.5"
      - name: Sandbox runtime
        env:
          SV_LLM_DOTGITHUB_ROOT: ${{ github.workspace }}/sv-llm-dotgithub
        run: python -B tests/test_sandbox_runtime.py
      - name: Check out SV-LLM/.github with Anthropic and OpenAI registered (SV-LLM/.github PR #5)
        uses: actions/checkout@v4
        with:
          repository: SV-LLM/.github
          ref: b85672154b8b05f17085031778021a24da114fc4
          path: sv-llm-dotgithub-registered
      - name: Real-entity contract-level regression (order 5)
        env:
          SV_LLM_DOTGITHUB_ROOT: ${{ github.workspace }}/sv-llm-dotgithub-registered
        run: python -B tests/test_real_entity_regression.py
      - name: Vendored StegBrowser llm.v1 upstream tests against the vendored bytes (AT-14)
        run: python -B -m pytest -q -p no:cacheprovider tests/stegbrowser_upstream
      - name: Sandbox + StegBrowser synthetic integration (no network)
        env:
          SV_LLM_DOTGITHUB_ROOT: ${{ github.workspace }}/sv-llm-dotgithub-registered
        run: python -B tests/test_stegbrowser_tool.py
