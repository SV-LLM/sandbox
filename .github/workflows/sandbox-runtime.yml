name: Validate Sandbox Runtime

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out SV-LLM/.github (re-pinned entity digests; vendored native schema evaluator)
        uses: actions/checkout@v4
        with:
          repository: SV-LLM/.github
          ref: 4dcf3cd439378ed53d989cd08cf3255b4e3b5b40  # SV-LLM/.github laneb/g4-ledger-append-epoch-refusal (G4)
          path: sv-llm-dotgithub
      - name: Sandbox runtime
        env:
          SV_LLM_DOTGITHUB_ROOT: ${{ github.workspace }}/sv-llm-dotgithub
        run: python -B tests/test_sandbox_runtime.py
      - name: Check out SV-LLM/.github with all 18 intelligence providers registered (vendored native schema evaluator)
        uses: actions/checkout@v4
        with:
          repository: SV-LLM/.github
          ref: 4dcf3cd439378ed53d989cd08cf3255b4e3b5b40  # SV-LLM/.github laneb/g4-ledger-append-epoch-refusal (G4)
          path: sv-llm-dotgithub-registered
      - name: Real-entity contract-level regression (order 5)
        env:
          SV_LLM_DOTGITHUB_ROOT: ${{ github.workspace }}/sv-llm-dotgithub-registered
        run: python -B tests/test_real_entity_regression.py
      - name: Vendored StegBrowser llm.v1 upstream tests against the vendored bytes (AT-14; standard library runner)
        run: |
          python -B tests/test_stegbrowser_upstream_runner.py
          python -B tests/run_stegbrowser_upstream.py
      - name: Sandbox + StegBrowser synthetic integration (no network)
        env:
          SV_LLM_DOTGITHUB_ROOT: ${{ github.workspace }}/sv-llm-dotgithub-registered
        run: python -B tests/test_stegbrowser_tool.py
      - name: AT-04 Stage 1 target derivation and refusals (no network)
        env:
          SV_LLM_DOTGITHUB_ROOT: ${{ github.workspace }}/sv-llm-dotgithub-registered
        run: python -B tests/test_live_target.py
      - name: Live lanes, conformance vs authentic organization-ledger evidence (no network)
        env:
          SV_LLM_DOTGITHUB_ROOT: ${{ github.workspace }}/sv-llm-dotgithub-registered
        run: python -B tests/test_live_lanes.py
      - name: Provider capability contract (sv-llm.provider-capability/v0.1, offline)
        env:
          SV_LLM_DOTGITHUB_ROOT: ${{ github.workspace }}/sv-llm-dotgithub
        run: python -B tests/test_provider_capability.py
      - name: Ecosystem Chat sandbox conformance proposal (stegverse.ai-invariant-conformance-proposal/v1, offline)
        run: python -B tests/test_conformance_proposal.py
      - name: Stage 2 page_load.v1 tool (synthetic browser, no network)
        env:
          SV_LLM_DOTGITHUB_ROOT: ${{ github.workspace }}/sv-llm-dotgithub-registered
        run: python -B tests/test_page_load_tool.py
      - name: "G4: a Sandbox receipt carries the supplied epoch; missing/invalid is refused six-field (SV_LLM_LEDGER_APPEND_CLOCK_FALLBACK)"
        env:
          SV_LLM_DOTGITHUB_ROOT: ${{ github.workspace }}/sv-llm-dotgithub
        run: python -B tests/test_ledger_supplied_epoch.py
      - name: SV-LLM work cycle end to end (peer manifest in, Sandbox, organization ledger, result out; no network)
        env:
          SV_LLM_DOTGITHUB_ROOT: ${{ github.workspace }}/sv-llm-dotgithub
        run: python -B tests/test_work_cycle.py
