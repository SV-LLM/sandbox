name: Validate Sandbox Runtime

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Check out SV-LLM/.github (re-pinned entity digests; vendored native schema evaluator)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: SV-LLM/.github
          ref: a00a72ec54055e11b23841e3718cfd7352ad8a8c  # SV-LLM/.github main (G4 #47 + B-P31 #49 merged)
          path: sv-llm-dotgithub
      - name: Sandbox runtime
        env:
          SV_LLM_DOTGITHUB_ROOT: ${{ github.workspace }}/sv-llm-dotgithub
        run: python -B tests/test_sandbox_runtime.py
      - name: Check out SV-LLM/.github with all 18 intelligence providers registered (vendored native schema evaluator)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: SV-LLM/.github
          ref: a00a72ec54055e11b23841e3718cfd7352ad8a8c  # SV-LLM/.github main (G4 #47 + B-P31 #49 merged)
          path: sv-llm-dotgithub-registered
      - name: Real-entity contract-level regression (order 5)
        env:
          SV_LLM_DOTGITHUB_ROOT: ${{ github.workspace }}/sv-llm-dotgithub-registered
        run: python -B tests/test_real_entity_regression.py
      - name: Vendored StegBrowser llm.v1 upstream tests against the vendored bytes (AT-14; standard library runner)
        run: |
          python -B tests/test_stegbrowser_upstream_runner.py
          python -B tests/run_stegbrowser_upstream.py
      - name: Sandbox + StegBrowser synthetic integration (no network)
        env:
          SV_LLM_DOTGITHUB_ROOT: ${{ github.workspace }}/sv-llm-dotgithub-registered
        run: python -B tests/test_stegbrowser_tool.py
      - name: AT-04 Stage 1 target derivation and refusals (no network)
        env:
          SV_LLM_DOTGITHUB_ROOT: ${{ github.workspace }}/sv-llm-dotgithub-registered
        run: python -B tests/test_live_target.py
      - name: Live lanes, conformance vs authentic organization-ledger evidence (no network)
        env:
          SV_LLM_DOTGITHUB_ROOT: ${{ github.workspace }}/sv-llm-dotgithub-registered
        run: python -B tests/test_live_lanes.py
      - name: Provider capability contract (sv-llm.provider-capability/v0.1, offline)
        env:
          SV_LLM_DOTGITHUB_ROOT: ${{ github.workspace }}/sv-llm-dotgithub
        run: python -B tests/test_provider_capability.py
      - name: Ecosystem Chat sandbox conformance proposal (stegverse.ai-invariant-conformance-proposal/v1, offline)
        run: python -B tests/test_conformance_proposal.py
      - name: RT-INVARIANT-EVALUATION-001 invariant question evaluation (offline)
        run: python -B tests/test_invariant_evaluation.py
      - name: Declaration-derived capability routing (offline)
        run: python -B tests/test_capability_routing.py
      - name: Workflow actions pinned to commit SHAs (offline)
        run: python -B tests/test_workflow_action_pins.py
      - name: Workflow triggers are event-driven only, no workflow_dispatch (offline)
        run: python -B tests/test_workflow_triggers.py
      - name: Stage 2 page_load.v1 tool (synthetic browser, no network)
        env:
          SV_LLM_DOTGITHUB_ROOT: ${{ github.workspace }}/sv-llm-dotgithub-registered
        run: python -B tests/test_page_load_tool.py
      - name: "G4: a Sandbox receipt carries the supplied epoch; missing/invalid is refused six-field (SV_LLM_LEDGER_APPEND_CLOCK_FALLBACK)"
        env:
          SV_LLM_DOTGITHUB_ROOT: ${{ github.workspace }}/sv-llm-dotgithub
        run: python -B tests/test_ledger_supplied_epoch.py
      - name: "G4: the browser lease time is the supplied epoch; no clock read; missing is refused six-field"
        env:
          SV_LLM_DOTGITHUB_ROOT: ${{ github.workspace }}/sv-llm-dotgithub
        run: python -B tests/test_lease_time_supplied_epoch.py
      - name: "One browser-lease contract (I7): contracts/browser-lease/v1 and runtime/lease_time.py agree"
        run: python -B tests/test_browser_lease_contract.py
      - name: StegNode binding fail-closed regression (offline)
        run: python -B -m unittest tests.test_stegnode_capability_binding
      - name: SV-LLM work cycle end to end (peer manifest in, Sandbox, organization ledger, result out; no network)
        env:
          SV_LLM_DOTGITHUB_ROOT: ${{ github.workspace }}/sv-llm-dotgithub
        run: python -B tests/test_work_cycle.py
      - name: "#163: native StegNode/InTr binding at WorkCycle _take/_return; FAIL_CLOSED without a WorkerCoordinator claim/fence (no network)"
        env:
          SV_LLM_DOTGITHUB_ROOT: ${{ github.workspace }}/sv-llm-dotgithub
        run: python -B tests/test_work_cycle_binding.py

      - name: Q56 suite Action refusal and custody controls (offline, normal and optimized)
        run: |
          python3 -B machine-economy-8374/github-marketplace/suite-action/test_action.py -q
          python3 -B -O machine-economy-8374/github-marketplace/suite-action/test_action.py -q
      - name: Q56 actual composite Action instantiation (offline)
        id: q56_instantiate
        uses: ./machine-economy-8374/github-marketplace/suite-action
        with:
          mode: instantiate
          spec-file: machine-economy-8374/github-marketplace/suite-action/examples/instantiate.json
          spec-sha256: 783bb7efe03e4561fe698aa5a9c90affefead177e4b92b6f168cd77e3755907d
      - name: Retain generated specimen in the workspace for read-only verification
        env:
          SUITE_RESULT: ${{ steps.q56_instantiate.outputs.result-directory }}
        run: cp -R "$SUITE_RESULT/suite" .q56-suite-specimen
      - name: Q56 actual composite Action verification (offline)
        uses: ./machine-economy-8374/github-marketplace/suite-action
        with:
          mode: verify
          suite-path: .q56-suite-specimen
          manifest-sha256: ${{ steps.q56_instantiate.outputs.manifest-sha256 }}
